<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f172a; color: #fff; direction: rtl; text-align: center;
    }
    h2 { margin: 8px 0 16px; font-size: 20px; }
    .day-select {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;
    }
    .day-btn {
      flex: 1; max-width: 110px; padding: 10px 0; border-radius: 10px; border: 2px solid #334155;
      background: #1e293b; color: #cbd5e1; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .day-btn.active { background: #22c55e; border-color: #22c55e; color: #0f172a; }

    .capture-wrap { max-width: 420px; margin: 0 auto; }
    #photoInput { display: none; }
    #captureBtn {
      width: 100%; padding: 18px 0; border-radius: 16px; border: 2px dashed #334155;
      background: #1e293b; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    #preview { width: 100%; max-width: 420px; margin: 12px auto 0; border-radius: 12px; display: none; }
    canvas { display: none; }

    #result {
      max-width: 420px; margin: 18px auto 0; min-height: 70px; border-radius: 14px; padding: 14px;
      font-size: 17px; font-weight: bold; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; transition: background .2s;
      background: #1e293b;
    }
    .ok { background: #16a34a !important; }
    .warn { background: #ca8a04 !important; }
    .err { background: #dc2626 !important; }
    #sub { font-weight: normal; font-size: 14px; opacity: .85; }

    .manual-label { max-width: 420px; margin: 18px auto 4px; text-align: right; font-size: 13px; color: #94a3b8; }
    .manual-wrap { max-width: 420px; margin: 0 auto; display: flex; gap: 8px; }
    #manualInput {
      flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #334155;
      background: #1e293b; color: #fff; font-size: 15px; direction: rtl;
    }
    #manualBtn {
      padding: 0 18px; border-radius: 10px; border: none; background: #3b82f6;
      color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>تسجيل الحضور بالـ QR</h2>

  <div class="day-select">
    <button class="day-btn active" data-day="DAY1">يوم 1</button>
    <button class="day-btn" data-day="DAY2">يوم 2</button>
    <button class="day-btn" data-day="DAY3">يوم 3</button>
  </div>

  <div class="capture-wrap">
    <input id="photoInput" type="file" accept="image/*" capture="environment" />
    <button id="captureBtn">📷 صوّر الـ QR</button>
    <img id="preview" />
    <canvas id="canvas"></canvas>
  </div>

  <div id="result">
    <span>دوس على الزرار وصوّر الـ QR</span>
  </div>

  <div class="manual-label">أو سجّل يدويًا (ID / رقم موبايل / اسم الطالب)</div>
  <div class="manual-wrap">
    <input id="manualInput" type="text" placeholder="اكتب هنا..." />
    <button id="manualBtn">تسجيل</button>
  </div>

  <script>
    let currentDay = 'DAY1';

    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDay = btn.dataset.day;
      });
    });

    const resultEl = document.getElementById('result');
    function setResult(html, cls) {
      resultEl.className = cls || '';
      resultEl.innerHTML = html;
    }

    // --- Photo capture (opens the phone's native camera app, no in-page permission needed) ---
    const photoInput = document.getElementById('photoInput');
    const captureBtn = document.getElementById('captureBtn');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    captureBtn.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = 'block';
      setResult('جاري قراءة الـ QR...', '');

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
          handleScan(code.data);
        } else {
          setResult('❌ مش قادر ألاقي QR في الصورة، جرّب تاني', 'err');
        }
        // allow re-selecting the same photo/taking another one
        photoInput.value = '';
      };
      img.src = url;
    });

    // --- Shared submit logic (used by both photo scan and manual entry) ---
    function handleScan(text) {
      setResult('جاري التسجيل...', '');
      google.script.run
        .withSuccessHandler(res => {
          if (res.status === 'success') {
            setResult('✅ تم تسجيل الحضور<div id="sub">' + res.name + '</div>', 'ok');
          } else if (res.status === 'already') {
            setResult('⚠️ مسجل قبل كده<div id="sub">' + res.name + '</div>', 'warn');
          } else if (res.status === 'notfound') {
            setResult('❌ الطالب مش موجود في الشيت', 'err');
          } else {
            setResult('❌ ' + (res.message || 'خطأ'), 'err');
          }
        })
        .withFailureHandler(err => {
          setResult('❌ خطأ: ' + err.message, 'err');
        })
        .markAttendance(text, currentDay);
    }

    // --- Manual entry ---
    const manualInput = document.getElementById('manualInput');
    const manualBtn = document.getElementById('manualBtn');

    function submitManual() {
      const value = manualInput.value.trim();
      if (!value) return;
      handleScan(value);
      manualInput.value = '';
    }

    manualBtn.addEventListener('click', submitManual);
    manualInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitManual();
    });
  </script>
</body>
</html>
